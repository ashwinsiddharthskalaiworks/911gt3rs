<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche 911 GT3 RS — Athletic in Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#ffffff',
                        slateCard: 'rgba(22, 24, 29, 0.75)',
                        porscheRed: '#E30613',
                        porscheGreen: '#39FF14',
                        porscheBlue: '#0066B1',
                        porscheGold: '#D4AF37',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #ffffff;
        }
        ::-webkit-scrollbar-thumb {
            background: #262930;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #E30613;
        }

        .glass-panel {
            background: rgba(16, 18, 22, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel-hover:hover {
            border-color: rgba(227, 6, 19, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(227, 6, 19, 0.2);
        }

        .text-glow-red {
            text-shadow: 0 0 20px rgba(227, 6, 19, 0.6);
        }

        .text-glow-green {
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.6);
        }

        /* Speedometer gauge animation */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        .animate-pulse-glow {
            animation: pulse-glow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-obsidian text-gray-100 font-sans antialiased overflow-x-hidden" x-data="porscheApp()">

    <!-- Header Navigation -->
    <header class="fixed top-0 left-0 right-0 z-50 px-4 sm:px-8 py-4 transition-all duration-300">
        <div class="max-w-7xl mx-auto glass-panel rounded-2xl px-6 py-3 flex items-center justify-between">
            <!-- Brand Logo -->
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-full bg-porscheRed/20 border border-porscheRed/50 flex items-center justify-center font-serif font-black text-porscheRed group-hover:scale-105 transition-transform">
                    P
                </div>
                <div class="flex flex-col">
                    <span class="font-serif font-bold tracking-[0.2em] text-sm text-white">PORSCHE</span>
                    <span class="font-mono text-[10px] tracking-widest text-porscheRed uppercase font-bold">911 GT3 RS</span>
                </div>
            </a>

            <!-- Navigation Links -->
            <nav class="hidden md:flex items-center gap-8 text-xs font-mono tracking-widest uppercase text-gray-400">
                <a href="#overview" class="hover:text-porscheRed transition-colors">Overview</a>
                <a href="#aerodynamics" class="hover:text-porscheRed transition-colors">Aerodynamics</a>
                <a href="#engine" class="hover:text-porscheRed transition-colors">Performance</a>
                <a href="#sound" class="hover:text-porscheRed transition-colors">Sound Simulator</a>
                <a href="#customizer" class="hover:text-porscheRed transition-colors">Customizer</a>
                <a href="#specs" class="hover:text-porscheRed transition-colors">Specs</a>
            </nav>

            <!-- CTA Button -->
            <div class="flex items-center gap-4">
                <button @click="openConfigModal = true" class="relative group overflow-hidden rounded-xl bg-porscheRed px-5 py-2.5 text-xs font-mono font-bold tracking-wider text-white shadow-lg shadow-porscheRed/20 transition-all hover:bg-red-700 active:scale-95">
                    <span class="relative z-10 flex items-center gap-2">
                        CONFIGURE <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
                    </span>
